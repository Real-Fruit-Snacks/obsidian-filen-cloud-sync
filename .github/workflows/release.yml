name: Release

# Tag push ("git tag 0.6.1 && git push origin 0.6.1") → build → GitHub release
# with the exact assets Obsidian/BRAT expect: main.js, manifest.json, styles.css.
# The tag MUST equal manifest.json's version (checked below).

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [ "$MANIFEST_VERSION" != "$TAG" ]; then
            echo "::error::Tag ($TAG) does not match manifest.json version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Mobile tripwire (no Node builtins in the bundle)
        run: |
          if grep -nE 'require\("(fs|crypto|path|os|stream|buffer|https|url|util|events|node:.*)"\)' main.js; then
            echo "::error::Node.js builtin imports found in main.js — refusing to release."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for ${GITHUB_REF_NAME} — falling back to generated notes"
            echo "NO_NOTES_FILE=1" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub release with plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$NO_NOTES_FILE" = "1" ]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
