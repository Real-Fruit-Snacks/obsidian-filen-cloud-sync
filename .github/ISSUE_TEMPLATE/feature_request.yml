name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What would you like?
      description: Describe the feature or change
      placeholder: "I'd like to…"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does this solve for you? How do you work around it today?
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      description: Mockups, links, prior art in other plugins…
